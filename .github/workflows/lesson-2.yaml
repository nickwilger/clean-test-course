name: Lesson 2

on:
  push:
    branches:
      - lesson-2
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Disable Debug
        run: |
          sed -i 's/DEBUG = True/DEBUG = False/g' hangry_api/hangry_api/settings.py
      - name: Generate deployment package
        run: zip -r deploy.zip . -x '*.git*'
      - name: '**PLACEHOLDER** Deploy to Elastic Beanstalk'
        run: echo Placeholder for Deployment

  unit_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Checkout
      - name: Setup Python
        uses: actions/setup-python@v7.1.0 
      - name: Install test environment
        run: |
          python -m pip install --upgrade pip
          pip install pytest django_mock_queries six coverage
        working-directory:
          backend
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt
      - name: Run unit tests
        run: |
          source venv/bin/activate
          pytest tests/unit --maxfail=1 --disable-warnings -q
            - name: Run unit tests
        run: |
          coverage run -m --source=./hangry_api pytest
          coverage report
        working-directory: backend